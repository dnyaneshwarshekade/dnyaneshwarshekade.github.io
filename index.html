<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dnyan Cloud</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        margin: 0;
        padding: 0;
    }

    body, html {
        height: 100%;
        width: 100%;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    #loader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
        font-size: 18px;
    }
</style>
</head>
<body>

<div id="loader">Loading...</div>

<iframe id="mainFrame"></iframe>

<script>
    const primaryURL = "https://www.dnyan.cloud";
    const fallbackURL = "https://dnyan.cloud";

    const iframe = document.getElementById("mainFrame");
    const loader = document.getElementById("loader");

    let fallbackUsed = false;

    iframe.src = primaryURL;

    iframe.onload = function () {
        loader.style.display = "none";
    };

    iframe.onerror = function () {
        if (!fallbackUsed) {
            fallbackUsed = true;
            iframe.src = fallbackURL;
        }
    };

    // Timeout fallback (if primary doesn't load within 5 seconds)
    setTimeout(() => {
        if (!fallbackUsed) {
            fallbackUsed = true;
            iframe.src = fallbackURL;
        }
    }, 5000);
</script>

</body>
</html>
