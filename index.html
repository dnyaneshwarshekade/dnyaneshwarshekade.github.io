<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dnyan Cloud Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        iframe {
            width: 50%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            iframe {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>
<body>

    <iframe src="https://www.dnyan.cloud"></iframe>
    <iframe src="https://dnyan.cloud"></iframe>

</body>
</html>
